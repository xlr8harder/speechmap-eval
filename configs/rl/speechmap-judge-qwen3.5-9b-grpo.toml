name = "speechmap-judge-qwen3.5-9b-grpo-v1-256tok"
model = "Qwen/Qwen3.5-9B"

max_steps = 100
batch_size = 128
rollouts_per_example = 8
learning_rate = 5e-5
lora_alpha = 16

[sampling]
max_tokens = 256
temperature = 0.7
enable_thinking = false

[[env]]
id = "xlr8harder/speechmap-judge"
version = "0.1.5"
args = { hf_dataset = "xlr8harder/speechmap-judge-rl-test-data", train_split = "train", eval_split = "eval", max_train_examples = 50000, max_eval_examples = 400 }

[val]
interval = 5
num_examples = 64
rollouts_per_example = 1

[eval]
interval = 10
num_examples = 400
rollouts_per_example = 1
eval_base_model = true

[[eval.env]]
id = "xlr8harder/speechmap-judge"
version = "0.1.5"
args = { hf_dataset = "xlr8harder/speechmap-judge-rl-test-data", train_split = "train", eval_split = "eval", max_train_examples = 50000, max_eval_examples = 400 }
num_examples = 400
rollouts_per_example = 1

[buffer]
online_difficulty_filtering = true
easy_threshold = 0.95
hard_threshold = 0.05
easy_fraction = 0.0
hard_fraction = 0.0
seed = 42

[checkpoints]
interval = 25
keep_cloud = 2

[adapters]
interval = 10
keep_last = 10
