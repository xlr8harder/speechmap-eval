[project]
name = "speechmap-eval"
version = "0.1.0"
description = "Collection, judging, and judge-evaluation tooling for SpeechMap"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "llm-client @ git+https://github.com/xlr8harder/llm_client.git",
    "matplotlib>=3.10.8",
    "mq",
    "numpy>=2.4.0",
    "pandas>=2.3.3",
    "plotly>=6.5.0",
    "python-dotenv>=1.0.1",
    "requests>=2.32.5",
    "streamlit>=1.52.2",
    "tqdm>=4.67.1",
    "verifiers[renderers]>=0.1.14",
]

[tool.uv.sources]
mq = { git = "https://github.com/xlr8harder/mq.git" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "training: requires the optional local model-training stack",
]
