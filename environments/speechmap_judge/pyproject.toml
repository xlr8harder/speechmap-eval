[project]
name = "speechmap-judge"
description = "SpeechMap compliance judge RL/eval environment"
tags = ["speechmap", "compliance", "judge", "train", "eval"]
version = "0.1.8"
requires-python = ">=3.10"
dependencies = [
    "datasets>=4.6.1",
    "verifiers>=0.1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["speechmap_judge"]
artifacts = ["speechmap_judge/data/*.jsonl"]

[tool.hatch.build.targets.sdist]
include = [
    "README.md",
    "pyproject.toml",
    "speechmap_judge/**/*.py",
    "speechmap_judge/data/*.jsonl",
]

[tool.verifiers.eval]
num_examples = 5
rollouts_per_example = 3
